<!doctype html><html><head><meta charset="utf-8"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script>Office.onReady();function insertTimestamp(event){const d=new Date();const p=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);const g=t=>p.find(x=>x.type===t)?.value||"";const s=`تاریخ و ساعت ارسال: ${g("year")}/${g("month")}/${g("day")} - ${g("hour")}:${g("minute")}`;Office.context.mailbox.item.body.setSelectedDataAsync(`<br><br><b>${s}</b>`,{coercionType:Office.CoercionType.Html},()=>event.completed());}</script></head><body></body></html>
