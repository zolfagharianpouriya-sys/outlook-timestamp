<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head><body><button id="insert">درج تاریخ و ساعت</button><script>Office.onReady(()=>document.getElementById('insert').onclick=insertTimestamp);function pad(n){return String(n).padStart(2,'0')}function insertTimestamp(){const d=new Date();const s=`تاریخ و ساعت ارسال: ${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} - ${pad(d.getHours())}:${pad(d.getMinutes())}`;Office.context.mailbox.item.body.setSelectedDataAsync(`<br><br><b>${s}</b>`,{coercionType:Office.CoercionType.Html},()=>{})}</script></body></html>
